<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boutique en Ligne</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f5f5f5;
      padding: 20px;
    }

    h1, h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    /* Grille des produits */
    .products-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      max-width: 1000px;
      margin: 0 auto 40px auto;
    }

    .product-card {
      background: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      width: 220px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .product-card img {
      width: 100%;
      height: 180px;
      object-fit: contain;
      border-radius: 4px;
      background: #fafafa;
      margin-bottom: 10px;
    }

    .product-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #333;
    }

    .product-price {
      font-size: 18px;
      font-weight: bold;
      color: #000;
      margin-bottom: 12px;
    }

    .btn-select {
      width: 100%;
      padding: 10px;
      background-color: #000000;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-select:hover {
      background-color: #333333;
    }

    /* Section Formulaire de Commande */
    .checkout-container {
      max-width: 450px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    .selected-product-box {
      background: #f0f0f0;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 15px;
      font-weight: bold;
      text-align: center;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #27ae60;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-submit:hover {
      background-color: #219150;
    }

    .loading-text {
      text-align: center;
      font-style: italic;
      color: #666;
    }
  </style>
</head>
<body>

  <h1>Nos Produits</h1>

  <!-- Conteneur pour charger les produits depuis Google Sheets -->
  <div id="products-container" class="products-grid">
    <p class="loading-text">Chargement des produits...</p>
  </div>

  <!-- Formulaire de validation de la commande -->
  <div class="checkout-container">
    <h2>Valider la Commande</h2>

    <div id="selected-product-info" class="selected-product-box">
      Veuillez choisir un produit ci-dessus
    </div>

    <form id="formCommande">
      <div class="form-group">
        <label for="nom">Nom Complet :</label>
        <input type="text" id="nom" placeholder="Ex: Mohamed Amine" required>
      </div>

      <div class="form-group">
        <label for="telephone">Numéro de Téléphone :</label>
        <input type="tel" id="telephone" placeholder="Ex: 0550123456" required>
      </div>

      <div class="form-group">
        <label for="adresse">Adresse de Livraison :</label>
        <input type="text" id="adresse" placeholder="Ex: Alger, Bab Ezzouar" required>
      </div>

      <button type="button" class="btn-submit" onclick="envoyerCommande()">Commander Maintenant</button>
    </form>
  </div>

  <script>
    // ⚠️ REMPLACEZ CETTE URL PAR VOTRE URL OBTENUE APRÈS LE DÉPLOIEMENT APPS SCRIPT
    const SCRIPT_URL = "https://script.google.com/macros/s/VOTRE_ID_DEPLOIEMENT/exec";

    let produitSelectionne = {
      nom: "",
      prix: ""
    };

    // 1. Charger les produits au chargement de la page
    window.onload = function() {
      chargerProduits();
    };

    function chargerProduits() {
      fetch(SCRIPT_URL)
        .then(response => response.json())
        .then(data => {
          const container = document.getElementById("products-container");
          container.innerHTML = "";

          if (!data || data.length === 0) {
            container.innerHTML = "<p>Aucun produit trouvé.</p>";
            return;
          }

          data.forEach(product => {
            const card = document.createElement("div");
            card.className = "product-card";
            card.innerHTML = `
              <img src="${product.image_url}" alt="${product.nom}" onerror="this.src='https://via.placeholder.com/150'">
              <div class="product-title">${product.nom}</div>
              <div class="product-price">${product.prix}</div>
              <button class="btn-select" onclick="choisirProduit('${product.nom.replace(/'/g, "\\'")}', '${product.prix}')">Sélectionner</button>
            `;
            container.appendChild(card);
          });
        })
        .catch(error => {
          console.error("Erreur de chargement :", error);
          document.getElementById("products-container").innerHTML = "<p>Erreur lors du chargement des produits.</p>";
        });
    }

    // 2. Sélectionner un produit
    function choisirProduit(nom, prix) {
      produitSelectionne.nom = nom;
      produitSelectionne.prix = prix;
      document.getElementById("selected-product-info").innerText = `Produit : ${nom} - ${prix}`;
      window.scrollTo({ top: document.querySelector('.checkout-container').offsetTop - 20, behavior: 'smooth' });
    }

    // 3. Envoyer la commande vers Google Sheets
    function envoyerCommande() {
      const nomVal = document.getElementById("nom").value.trim();
      const telVal = document.getElementById("telephone").value.trim();
      const adrVal = document.getElementById("adresse").value.trim();

      if (!produitSelectionne.nom) {
        alert("Veuillez sélectionner un produit avant de commander.");
        return;
      }

      if (!nomVal || !telVal || !adrVal) {
        alert("Veuillez remplir tous les champs du formulaire.");
        return;
      }

      const payload = {
        nom: nomVal,
        telephone: telVal,
        adresse: adrVal,
        produit: produitSelectionne.nom,
        prix: produitSelectionne.prix
      };

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(payload)
      })
      .then(() => {
        alert("Votre commande a été envoyée avec succès !");
        document.getElementById("formCommande").reset();
        document.getElementById("selected-product-info").innerText = "Veuillez choisir un produit ci-dessus";
        produitSelectionne = { nom: "", prix: "" };
      })
      .catch(error => {
        console.error("Erreur d'envoi :", error);
        alert("Une erreur est survenue lors de la commande.");
      });
    }
  </script>

</body>
</html>
